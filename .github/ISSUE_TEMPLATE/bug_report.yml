name: Bug report
description: Report a reproducible Dynamic Skill Loader bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, MCP requests, and minimal skill files.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v20.0.0"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI agent or client
      options:
        - Claude Code / Claude Desktop
        - OpenCode
        - Cursor
        - Windsurf
        - Codex
        - Gemini CLI
        - Aider
        - Other MCP client
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
