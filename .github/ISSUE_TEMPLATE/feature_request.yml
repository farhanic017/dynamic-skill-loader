name: Feature request
description: Suggest an agent, skill format, parser feature, or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow should Dynamic Skill Loader handle better?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, CLI flag, MCP tool, or format support you want.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Link relevant skill formats, repos, agent docs, or sample files.
